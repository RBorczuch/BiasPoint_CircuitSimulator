# cargo-deny configuration: license policy from Instrukcja.md §9.
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are unpublished and not yet licensed.
ignore = true

[workspace]
resolver = "3"
members = ["crates/bpt-dsp", "crates/bpt-py"]

[workspace.package]
version = "0.1.0-beta"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

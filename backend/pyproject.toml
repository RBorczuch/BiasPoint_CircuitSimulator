[project]
name = "bpt"
version = "0.1.0b0"
description = "BiasPoint backend: project model, simulation orchestration, API and MCP"
requires-python = ">=3.13"
dependencies = [
    "bpt-native",
    "fastapi>=0.146.0",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "platformdirs>=4.13.4",
    "pydantic>=2.14.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
bpt = "bpt.cli:main"
bpt-mcp = "bpt.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bpt"]

[tool.uv.sources]
bpt-native = { path = "../engine/crates/bpt-py", editable = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PTH"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# Symbol graphics tables: long coordinate rows, list concatenation, typographic minus.
"bpt/library/builtin.py" = ["E501", "RUF001", "RUF005"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["bpt"]

[[tool.mypy.overrides]]
module = ["bpt_native"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ngspice: requires the ngspice shared library"]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "mypy>=2.4.0",
    "pip-licenses>=5.5.5",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
